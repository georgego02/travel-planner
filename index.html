<style>
  /* ---------- шрифты (локально, работают офлайн) ---------- */
  @font-face { font-family: "Fira Sans"; font-weight: 400; font-display: swap; src: url(fonts/fira-sans-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Fira Sans"; font-weight: 400; font-display: swap; src: url(fonts/fira-sans-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Fira Sans"; font-weight: 500; font-display: swap; src: url(fonts/fira-sans-cyrillic-500-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Fira Sans"; font-weight: 500; font-display: swap; src: url(fonts/fira-sans-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Fira Sans"; font-weight: 600; font-display: swap; src: url(fonts/fira-sans-cyrillic-600-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Fira Sans"; font-weight: 600; font-display: swap; src: url(fonts/fira-sans-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 600; font-display: swap; src: url(fonts/fira-sans-condensed-cyrillic-600-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 600; font-display: swap; src: url(fonts/fira-sans-condensed-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; font-display: swap; src: url(fonts/fira-sans-condensed-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; font-display: swap; src: url(fonts/fira-sans-condensed-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+2215,U+FEFF,U+FFFD; }

  /* ---------- токены «Зимние Альпы» ---------- */
  :root { color-scheme: light; }
  :root {
    --snow: #F2F5F7; --paper: #FFFFFF; --fir: #173A33; --ink: #12201D; --slate: #46555B; --faint: #5B6A70;
    --wine: #8C2338; --wine-ink: #FFFFFF; --wine-soft: #F6E6E9; --frost: #D6E0E5; --edge: #7D8E95;
    --sign-dim: #46555B; --fs: 1.12; --fir-soft: #E4EFEB; --fir-line: #A8C3BA; --ice: #E9F1F5; --chart: #1F8562; --focus: #8C2338;
    --ok: #2A6645; --ok-soft: #E2F0E7; --plan: #6E5410; --plan-soft: #F5EED8; --idea: #55528A; --idea-soft: #ECEBF5;
    --warn: #8A3F14; --warn-soft: #F8EBE2;
    --cond: "Fira Sans Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
    --body: "Fira Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --bar-h: 52px; --nav-h: 62px; --r-sign: 14px; --r: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: var(--body); background: var(--snow); color: var(--ink); font-size: calc(16px * var(--fs)); line-height: 1.55;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px); -webkit-text-size-adjust: 100%; }
  body.locked { overflow: hidden; }
  a { color: var(--wine); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }
  svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

  /* ---------- верхняя панель ---------- */
  .appbar { position: sticky; top: 0; z-index: 20; background: var(--snow); padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; transition: border-color .2s; }
  .appbar.scrolled { border-bottom-color: var(--frost); }
  .appbar .wrap { height: var(--bar-h); display: flex; align-items: center; gap: 2px; }
  .appbar h1 { flex: 1; margin: 0; font: 700 calc(19px * var(--fs))/1.1 var(--cond); color: var(--fir); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { position: relative; width: 48px; height: 48px; border: 0; background: none; border-radius: 12px; display: grid; place-items: center; color: var(--ink); text-decoration: none; }
  .iconbtn:active { background: var(--frost); }
  .iconbtn.spin svg { animation: spin .9s linear infinite; }
  .iconbtn .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--wine); box-shadow: 0 0 0 2px var(--snow); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- шапка: статус и табличка-указатель ---------- */
  .hero { position: relative; padding: 6px 0 4px; }
  .hero::before { content: ""; position: absolute; right: -18px; top: -6px; width: 220px; height: 92px; pointer-events: none; z-index: 0;
    background: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 220 92%27%3E%3Cpath d=%27M0 92 L38 52 L58 66 L96 18 L120 44 L138 30 L176 70 L196 56 L220 72 L220 92Z%27 fill=%27%23E4EDF1%27/%3E%3Cpath d=%27M84 33 L96 18 L108 32 L101 29 L96 34 L90 29Z%27 fill=%27%23FFFFFF%27/%3E%3Cpath d=%27M0 92 L38 52 L58 66 L96 18 L120 44 L138 30 L176 70 L196 56 L220 72%27 fill=%27none%27 stroke=%27%23C9D6DC%27 stroke-width=%271.5%27/%3E%3C/svg%3E") no-repeat right top / contain; }
  .hero > * { position: relative; z-index: 1; }
  .status { font: 700 calc(34px * var(--fs))/1.05 var(--cond); letter-spacing: -.01em; color: var(--fir); margin: 0; }
  .dates { color: var(--slate); font-size: calc(15px * var(--fs)); margin-top: 6px; }
  .people { color: var(--slate); font-size: calc(15px * var(--fs)); }
  .sign { margin: 16px 0 6px; background: var(--paper); color: var(--fir); border: 2px solid var(--fir); border-radius: var(--r-sign); padding: 4px; box-shadow: 0 2px 10px rgba(23,58,51,.07); }
  .sign ol { list-style: none; margin: 0; padding: 4px 0; border: 1px solid var(--fir-line); border-radius: calc(var(--r-sign) - 4px); }
  .sign li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; margin: 0 4px; border-radius: 7px; }
  .sign li + li { margin-top: 2px; }
  .sign .arr { display: grid; place-items: center; color: var(--sign-dim); }
  .sign .city { font: 700 calc(22px * var(--fs))/1.15 var(--cond); letter-spacing: .005em; }
  .sign .when { font: 600 calc(16px * var(--fs))/1.2 var(--cond); color: var(--sign-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sign li.done .city { color: var(--faint); font-weight: 600; }
  .sign li.now { background: var(--wine-soft); color: var(--wine); box-shadow: inset 3px 0 0 var(--wine); }
  .sign li.now .arr, .sign li.now .when { color: inherit; }
  .sign .ends { display: flex; justify-content: space-between; padding: 6px 12px 3px 42px; font-size: calc(13px * var(--fs)); color: var(--sign-dim); }
  .note { color: var(--slate); font-size: calc(14px * var(--fs)); margin: 8px 0 0; }

  .banner { margin: 14px 0 0; padding: 11px 13px; border-radius: var(--r); font-size: calc(14px * var(--fs)); background: var(--warn-soft); color: var(--warn); }
  .banner.info { background: var(--paper); color: var(--ink); border: 1px solid var(--frost); }

  /* ---------- сегодня ---------- */
  .now { margin: 18px 0 0; background: var(--paper); border: 1px solid var(--frost); border-left: 4px solid var(--wine); border-radius: var(--r-sign); padding: 12px 14px 14px; box-shadow: 0 2px 10px rgba(23,58,51,.05); }
  .now .lbl { font-size: calc(14px * var(--fs)); color: var(--slate); }
  .now .next { font: 700 calc(21px * var(--fs))/1.25 var(--cond); margin-top: 2px; }
  .now .when { color: var(--slate); font-size: calc(15px * var(--fs)); }
  .now .acts { display: flex; gap: 8px; margin-top: 10px; }

  /* ---------- общие элементы ---------- */
  section.panel { display: none; padding-top: 6px; }
  #route-view { scroll-margin-top: calc(var(--bar-h) + 8px); }
  section.panel.active { display: block; }
  .seg { display: flex; background: var(--ice); border: 1px solid var(--frost); border-radius: 11px; padding: 3px; margin: 18px 0 12px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 9px; min-height: 44px; font: 600 calc(15px * var(--fs)) var(--cond); color: var(--slate); }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chip { flex: none; min-height: 46px; border: 1px solid var(--edge); background: var(--paper); border-radius: 999px; padding: 0 16px; font-size: calc(15px * var(--fs)); white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--fir-soft); border-color: var(--fir); color: var(--fir); font-weight: 600; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px;
    background: var(--wine); color: var(--wine-ink); font: 600 calc(16px * var(--fs)) var(--body); text-decoration: none; }
  .btn.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--edge); }
  .btn.danger { background: var(--paper); color: var(--wine); border: 1px solid var(--edge); }
  .btn.small { min-height: 42px; font-size: calc(15px * var(--fs)); flex: 1; }
  .btn.ghost { background: none; color: var(--ink); border: 1px dashed var(--edge); }
  .hint { color: var(--slate); font-size: calc(15px * var(--fs)); margin: 12px 0; }
  .empty { color: var(--slate); text-align: center; padding: 34px 12px; font-size: calc(15px * var(--fs)); }
  .badge { display: inline-block; font-size: calc(14px * var(--fs)); line-height: 1.45; padding: 2px 9px; border-radius: 6px; background: var(--frost); color: var(--ink); white-space: nowrap; }
  .badge.st-idea { background: var(--idea-soft); color: var(--idea); }
  .badge.st-plan { background: var(--plan-soft); color: var(--plan); }
  .badge.st-booked, .badge.st-paid { background: var(--ok-soft); color: var(--ok); }
  .badge.wait { background: var(--warn-soft); color: var(--warn); }
  .badge.plain { background: none; border: 1px solid var(--frost); color: var(--slate); }
  h2.sec { font: 700 calc(21px * var(--fs)) var(--cond); margin: 20px 0 10px; }
  .row-acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }

  /* ---------- навигация ---------- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1px solid var(--frost);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; max-width: 180px; height: var(--nav-h); border: 0; background: none; color: var(--slate);
    font: 600 0.875rem var(--cond); letter-spacing: .01em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  nav.tabs button svg.i { width: 25px; height: 25px; }
  nav.tabs button[aria-current="page"] { color: var(--wine); }

  /* ---------- лента дней и фильтры ---------- */
  .strip { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top)); z-index: 15; background: var(--snow);
    margin: 0 -18px; padding: 8px 18px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--frost); }
  .strip::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
  .strip button { flex: none; min-width: 56px; min-height: 48px; border: 1px solid var(--frost); background: var(--paper); border-radius: 10px; padding: 4px 8px; line-height: 1.15; text-align: center; }
  .strip button .d { display: block; font-size: calc(13px * var(--fs)); color: var(--slate); }
  .strip button .n { display: block; font: 700 calc(17px * var(--fs)) var(--cond); font-variant-numeric: tabular-nums; }
  .strip button.today { border-color: var(--wine); }
  .strip button[aria-current="true"] { background: var(--fir-soft); border-color: var(--fir); color: var(--fir); box-shadow: inset 0 0 0 1px var(--fir); }
  .strip button[aria-current="true"] .d { color: var(--fir); }
  .filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 12px -18px 0; padding: 0 18px; }

  /* ---------- таймлайн дня ---------- */
  .day { padding-top: 22px; scroll-margin-top: calc(var(--bar-h) + 76px + env(safe-area-inset-top)); }
  .day-head { display: flex; align-items: baseline; gap: 10px; }
  .day-head .t { font: 700 calc(24px * var(--fs)) var(--cond); color: var(--fir); }
  .day-head .d { color: var(--slate); font-size: calc(15px * var(--fs)); flex: 1; }
  .day-head .sum { color: var(--slate); font: 600 calc(15px * var(--fs)) var(--cond); font-variant-numeric: tabular-nums; }
  .day-head .today { font: 600 calc(13px * var(--fs)) var(--body); color: var(--wine); }
  .day-head .wx { font: 600 calc(14px * var(--fs)) var(--cond); color: var(--fir); background: var(--ice); border: 1px solid var(--frost); padding: 1px 8px; border-radius: 99px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .day-route { color: var(--slate); font-size: calc(15px * var(--fs)); margin: 1px 0 8px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .ev { width: 100%; border: 0; background: none; text-align: left; display: grid; grid-template-columns: 46px 28px 1fr; gap: 0 8px; padding: 0; min-height: 56px; }
  .ev .tm { font: 700 calc(17px * var(--fs))/1 var(--cond); font-variant-numeric: tabular-nums; padding-top: 12px; text-align: right; color: var(--ink); }
  .ev .rail { position: relative; display: flex; justify-content: center; }
  .ev .rail::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--frost); }
  .tl li:first-child .ev .rail::before { top: 14px; }
  .tl li:last-child .ev .rail::before { bottom: calc(100% - 14px); }
  .ev .node { position: relative; margin-top: 6px; width: 28px; height: 28px; border-radius: 50%; background: var(--paper); border: 2px solid var(--fir); color: var(--fir); display: grid; place-items: center; }
  .ev .node svg.i { width: 15px; height: 15px; stroke-width: 2; }
  .ev.is-idea .node { border-style: dashed; border-color: var(--edge); color: var(--slate); }
  .ev .body { padding: 9px 0 14px; border-bottom: 1px solid var(--frost); min-width: 0; }
  .tl li:last-child .ev .body { border-bottom: 0; }
  .ev .title { display: block; font-weight: 500; font-size: calc(17px * var(--fs)); line-height: 1.3; }
  .ev .sub { display: block; color: var(--slate); font-size: calc(15px * var(--fs)); margin-top: 1px; }
  .ev .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .ev.is-past .title, .ev.is-past .tm { color: var(--slate); }
  .ev.is-past .node { border-color: var(--edge); color: var(--slate); }
  .ev.is-next .node { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }

  /* ---------- карта ---------- */
  #map { position: relative; z-index: 0; isolation: isolate; height: calc(100vh - 260px); min-height: 360px; border-radius: var(--r-sign); border: 1px solid var(--frost); margin-top: 12px; background: var(--frost); }
  #map.dim .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.6); }
  .pin { width: 30px; height: 30px; border-radius: 50%; background: var(--fir); color: #fff; border: 2px solid #fff; display: grid; place-items: center;
    font: 700 calc(14px * var(--fs)) var(--cond); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .pin.today { background: var(--wine); color: var(--wine-ink); }
  .pin.idea { background: var(--paper); color: var(--fir); border: 2px dashed var(--fir); }
  .me-dot { width: 16px; height: 16px; border-radius: 50%; background: #1A73E8; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(26,115,232,.25), 0 1px 4px rgba(0,0,0,.4); }
  .map-loc { position: absolute; right: 10px; bottom: 26px; z-index: 500; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--edge); background: var(--paper); color: var(--ink); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .leaflet-popup-content { font-family: var(--body); font-size: calc(14px * var(--fs)); margin: 12px 14px; }
  .leaflet-popup-content b { font-family: var(--cond); font-size: calc(16px * var(--fs)); }
  .leaflet-popup-content button { margin-top: 8px; border: 0; background: var(--wine); color: var(--wine-ink); border-radius: 8px; padding: 6px 10px; font: 600 calc(14px * var(--fs)) var(--body); }
  .map-note { color: var(--slate); font-size: calc(13px * var(--fs)); margin-top: 8px; }

  /* ---------- нижняя карточка ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(9,20,17,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.2);
    max-height: 90vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s ease; padding: 0 0 calc(18px + env(safe-area-inset-bottom)); overscroll-behavior: contain; visibility: hidden; }
  .sheet.open { transform: translateY(0); visibility: visible; }
  .sheet .inner { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .sheet .handle { padding: 10px 0 2px; display: grid; place-items: center; touch-action: none; }
  .sheet .handle i { width: 40px; height: 5px; border-radius: 3px; background: var(--frost); }
  .sheet .top { display: flex; align-items: center; gap: 8px; color: var(--slate); font-size: calc(14px * var(--fs)); min-height: 44px; }
  .sheet .top .grow { flex: 1; }
  .sheet .top.title { color: var(--ink); font: 700 calc(21px * var(--fs)) var(--cond); }
  .sheet h3 { margin: 2px 0 4px; font: 700 calc(26px * var(--fs))/1.15 var(--cond); }
  .sheet .when { color: var(--slate); font-size: calc(15px * var(--fs)); }
  .sheet .addr { font-size: calc(15px * var(--fs)); margin-top: 2px; }
  .sheet .details { margin-top: 12px; font-size: calc(16px * var(--fs)); white-space: pre-line; }
  .sheet p.lead { color: var(--slate); font-size: calc(15px * var(--fs)); margin: 0 0 4px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--frost); border: 1px solid var(--frost); border-radius: var(--r); overflow: hidden; margin-top: 16px; }
  .fact { background: var(--paper); padding: 9px 12px; }
  .fact .k { font-size: calc(13px * var(--fs)); color: var(--slate); }
  .fact .v { font-weight: 500; margin-top: 1px; }
  .actions { display: grid; gap: 8px; margin-top: 18px; }
  @media (min-width: 700px) { .actions { grid-template-columns: 1fr 1fr; } }

  /* ---------- формы ---------- */
  .fld { display: block; margin-top: 14px; }
  .fld > span { display: block; font-size: calc(14px * var(--fs)); color: var(--slate); margin-bottom: 6px; }
  .inp { width: 100%; border: 1px solid var(--edge); background: var(--snow); border-radius: var(--r); padding: 11px 12px; font-size: calc(16px * var(--fs)); min-height: 48px; }
  .inp:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .inp[aria-invalid="true"] { border-color: var(--wine); }
  textarea.inp { resize: vertical; min-height: 88px; }
  .amount { position: relative; }
  .amount .inp { font: 700 calc(30px * var(--fs)) var(--cond); padding-right: 62px; font-variant-numeric: tabular-nums; }
  .amount .cur { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 600 calc(18px * var(--fs)) var(--cond); color: var(--slate); }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .cats .chip[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }
  .err { color: var(--wine); font-size: calc(14px * var(--fs)); margin-top: 8px; min-height: 1.2em; }

  /* ---------- бюджет ---------- */
  .total { margin: 6px 0 4px; }
  .total .k { color: var(--slate); font-size: calc(15px * var(--fs)); }
  .total .v { font: 700 calc(44px * var(--fs))/1.05 var(--cond); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .total .s { color: var(--slate); font-size: calc(14px * var(--fs)); margin-top: 2px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--frost); border: 1px solid var(--frost); border-radius: var(--r); overflow: hidden; margin: 14px 0 18px; }
  .kpi { background: var(--paper); padding: 10px 12px; }
  .kpi .k { color: var(--slate); font-size: calc(13px * var(--fs)); }
  .kpi .v { font: 700 calc(22px * var(--fs)) var(--cond); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 99px; background: var(--frost); overflow: hidden; margin: 10px 0 2px; }
  .bar > i { display: block; height: 100%; background: var(--chart); border-radius: 99px; }
  .bar.over > i { background: var(--wine); }
  .chart { margin: 4px 0 20px; }
  .chart h3, .list h3 { font: 600 calc(15px * var(--fs)) var(--body); color: var(--slate); margin: 0 0 8px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 132px; padding-top: 22px; border-bottom: 1px solid var(--edge); }
  .bars button { flex: 1; height: 100%; border: 0; background: none; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
  .bars .col { width: 100%; max-width: 30px; background: var(--chart); border-radius: 4px 4px 0 0; min-height: 0; }
  .bars .col.zero { height: 2px !important; background: var(--frost); border-radius: 1px; }
  .bars .val { position: absolute; font: 600 calc(12.5px * var(--fs)) var(--cond); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bars button[aria-pressed="true"] .col { outline: 2px solid var(--ink); outline-offset: 2px; }
  .axis { display: flex; gap: 6px; margin-top: 5px; }
  .axis span { flex: 1; text-align: center; font: 600 calc(13px * var(--fs)) var(--cond); color: var(--slate); }
  .axis span.today { color: var(--wine); }
  .list { margin-bottom: 20px; }
  .list .items { background: var(--paper); border: 1px solid var(--frost); border-radius: var(--r); overflow: hidden; }
  .list .r { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 13px; border: 0; border-top: 1px solid var(--frost); background: none; text-align: left; min-height: 52px; }
  .list .r:first-child { border-top: 0; }
  .list .r .l { flex: 1; min-width: 0; }
  .list .r .l small { display: block; color: var(--slate); font-size: calc(13px * var(--fs)); }
  .list .r .n { font: 600 calc(16px * var(--fs)) var(--cond); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { height: 4px; border-radius: 99px; background: var(--frost); margin-top: 6px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--chart); }
  .group-head { display: flex; justify-content: space-between; color: var(--slate); font: 600 calc(15px * var(--fs)) var(--body); margin: 18px 2px 6px; }

  .fab { position: fixed; right: max(18px, calc(50% - 342px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); z-index: 25;
    display: flex; align-items: center; gap: 8px; border: 0; border-radius: 28px; height: 54px; padding: 0 22px 0 18px;
    background: var(--wine); color: var(--wine-ink); font: 700 calc(17px * var(--fs)) var(--cond); box-shadow: 0 6px 18px rgba(0,0,0,.22); }
  .fab[hidden] { display: none; }
  #p-budget, #p-ideas, #p-prep { padding-bottom: 76px; }

  /* ---------- подготовка: дела и вещи ---------- */
  .check { width: 100%; display: flex; align-items: center; gap: 12px; background: var(--paper); border: 1px solid var(--frost); border-radius: var(--r); padding: 11px 12px; margin-bottom: 6px; text-align: left; min-height: 54px; }
  .check .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--edge); flex: none; display: grid; place-items: center; color: #fff; }
  .check .box svg.i { width: 15px; height: 15px; stroke-width: 2.8; }
  .check[aria-pressed="true"] .box { background: var(--chart); border-color: var(--chart); }
  .check[aria-pressed="true"] .name { text-decoration: line-through; color: var(--slate); }
  .check .name { flex: 1; min-width: 0; }
  .check .name small { display: block; color: var(--slate); font-size: calc(13px * var(--fs)); text-decoration: none; }
  .check .side { color: var(--slate); font-size: calc(13px * var(--fs)); text-align: right; white-space: nowrap; }
  .due { font: 600 calc(14px * var(--fs)) var(--cond); }
  .due.late { color: var(--wine); }
  .due.soon { color: var(--warn); }
  div.check { cursor: default; }

  /* ---------- идеи ---------- */
  .idea { display: flex; gap: 12px; background: var(--paper); border: 1px solid var(--frost); border-radius: var(--r); padding: 12px; margin-bottom: 6px; }
  .idea .txt { flex: 1; min-width: 0; }
  .idea .t { font-weight: 500; }
  .idea .c { font-size: calc(15px * var(--fs)); color: var(--slate); margin-top: 2px; }
  .idea .a { font-size: calc(14px * var(--fs)); color: var(--slate); margin-top: 6px; }
  .vote { flex: none; align-self: flex-start; min-width: 56px; min-height: 48px; border: 1px solid var(--edge); background: var(--paper); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 2px 8px; }
  .vote svg.i { width: 18px; height: 18px; }
  .vote b { font: 700 calc(16px * var(--fs)) var(--cond); line-height: 1.1; }
  .vote[aria-pressed="true"] { background: var(--wine); border-color: var(--wine); color: var(--wine-ink); }
  .vote[aria-pressed="true"] svg.i { fill: currentColor; }


  /* ---------- сейчас и далее ---------- */
  .now .cur { display: flex; gap: 8px; align-items: baseline; margin: 4px 0 6px; font-size: calc(15px * var(--fs)); color: var(--slate); }
  .tag { display: inline-block; font: 600 calc(13px * var(--fs)) var(--body); letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--fir-soft); color: var(--fir); white-space: nowrap; }
  .tag.next { background: var(--wine-soft); color: var(--wine); }
  .nn-block { margin-top: 14px; }
  .nn-big { margin-top: 18px; padding: 16px; border: 2px solid var(--wine); border-radius: var(--r-sign); background: var(--paper); }
  .nn-big .tm { font: 700 calc(44px * var(--fs))/1 var(--cond); font-variant-numeric: tabular-nums; color: var(--ink); margin-top: 8px; }
  .nn-big .ttl { font: 700 calc(24px * var(--fs))/1.2 var(--cond); margin-top: 6px; }
  .nn-big .in { font-size: calc(17px * var(--fs)); margin-top: 4px; }
  .nn-big .addr { color: var(--slate); font-size: calc(15px * var(--fs)); }
  .nn-cur { padding: 12px 14px; border-radius: var(--r); background: var(--fir-soft); }
  .nn-cur .ttl { font: 700 calc(19px * var(--fs))/1.25 var(--cond); margin-top: 4px; }
  .walk { margin-top: 10px; font-size: calc(16px * var(--fs)); min-height: 1.4em; }
  .leg { color: var(--slate); font-size: calc(14px * var(--fs)); padding: 4px 0 6px 82px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .leg .warn { color: var(--warn); background: var(--warn-soft); padding: 1px 8px; border-radius: 6px; font-weight: 500; }
  .leg .mv { display: inline-flex; align-items: center; gap: 5px; }
  .leg svg.i, .sunset-row svg.i { width: 16px; height: 16px; }
  .tl li.leg, .tl li.sunrow { position: relative; }
  .tl li.leg::before, .tl li.sunrow::before { content: ""; position: absolute; left: 67px; top: 0; bottom: 0; width: 2px; background: var(--frost); }
  .day-head .wx { display: inline-flex; align-items: center; gap: 4px; }
  .day-head .wx svg.i { width: 16px; height: 16px; }
  .leaflet-popup-content .pop-link { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--edge); color: var(--ink); text-decoration: none; font: 600 14px var(--body); }
  .sunset-row { color: var(--plan); background: var(--plan-soft); font: 600 calc(13.5px * var(--fs)) var(--body); padding: 4px 10px; margin: 4px 0 6px 82px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; }
  .later { list-style: none; margin: 8px 0 0; padding: 0; border: 1px solid var(--frost); border-radius: var(--r); background: var(--paper); overflow: hidden; }
  .later button { width: 100%; display: grid; grid-template-columns: 50px 1fr; gap: 8px; align-items: baseline; text-align: left; border: 0; border-top: 1px solid var(--frost); background: none; padding: 12px 14px; min-height: 52px; }
  .later li:first-child button { border-top: 0; }
  .later .t { font: 700 calc(17px * var(--fs)) var(--cond); font-variant-numeric: tabular-nums; }
  .later .w { font-size: calc(16px * var(--fs)); }
  .sec-k { font: 600 calc(15px * var(--fs)) var(--body); color: var(--slate); margin: 20px 0 6px; }

  /* ---------- карточка места: фото, Википедия ---------- */
  .place-photo { margin: 2px 0 12px; border-radius: var(--r-sign); overflow: hidden; background: var(--ice); aspect-ratio: 16 / 10; }
  .place-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wiki { margin-top: 16px; background: var(--ice); border-radius: var(--r); padding: 12px 14px; }
  .wiki .k { font: 600 calc(14px * var(--fs)) var(--body); color: var(--slate); margin-bottom: 4px; }
  .wiki p { margin: 0; font-size: calc(16px * var(--fs)); }
  .wiki a { display: inline-flex; align-items: center; min-height: 44px; font-size: calc(15px * var(--fs)); }

  /* ---------- порядок точек ---------- */
  .opt-sum { font-size: calc(17px * var(--fs)); margin: 4px 0 10px; }
  .opt-sum b { font-family: var(--cond); font-size: calc(20px * var(--fs)); }
  .opt-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--frost); border-radius: var(--r); overflow: hidden; }
  .opt-list li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 11px 14px; border-top: 1px solid var(--frost); align-items: baseline; }
  .opt-list li:first-child { border-top: 0; }
  .opt-list .t { font: 700 calc(17px * var(--fs)) var(--cond); font-variant-numeric: tabular-nums; }
  .opt-list li.moved { background: var(--fir-soft); }
  .opt-list li.fixed .w { color: var(--slate); }
  .idea { flex-wrap: wrap; }
  .idea-links { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; margin-top: -2px; }
  .idea-links .btn { min-height: 44px; font-size: calc(15px * var(--fs)); padding: 0 12px; flex: 0 0 auto; }
  .day-tools { margin: 0 0 6px; }
  .day-tools .btn { min-height: 44px; font-size: calc(15px * var(--fs)); display: inline-flex; flex: none; }
  /* ---------- часы работы ---------- */
  .badge.hours { background: var(--warn-soft); color: var(--warn); }
  .hours-warn { margin-top: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-size: calc(16px * var(--fs)); }

  /* ---------- брони ---------- */
  .bk { background: var(--paper); border: 1px solid var(--frost); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; }
  .bk.done { border-color: var(--frost); }
  .bk .hd { display: flex; align-items: center; gap: 8px; color: var(--slate); font-size: calc(15px * var(--fs)); }
  .bk .hd .grow { flex: 1; }
  .bk .ttl { font: 700 calc(19px * var(--fs))/1.25 var(--cond); margin-top: 4px; }
  .bk .route { font-size: calc(16px * var(--fs)); margin-top: 2px; }
  .bk .nt { color: var(--slate); font-size: calc(15px * var(--fs)); margin-top: 4px; }
  .bk .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .bk .acts .btn { min-height: 44px; font-size: calc(15px * var(--fs)); padding: 0 14px; flex: 0 1 auto; }

  /* ---------- подарки ---------- */
  .gift-sum { font-size: calc(16px * var(--fs)); margin: 4px 0 2px; }

  /* ---------- фразы ---------- */
  .ph-cat { font: 700 calc(19px * var(--fs)) var(--cond); margin: 22px 0 8px; color: var(--fir); }
  .ph { background: var(--paper); border: 1px solid var(--frost); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; }
  .ph .de { font: 600 calc(20px * var(--fs))/1.3 var(--body); }
  .ph .tr { color: var(--slate); font-size: calc(15px * var(--fs)); margin-top: 2px; }
  .ph .ru { font-size: calc(16px * var(--fs)); margin-top: 4px; }
  .ph .acts { display: flex; gap: 8px; margin-top: 10px; }
  .ph .acts .btn { min-height: 44px; font-size: calc(15px * var(--fs)); flex: 1; }
  .show-de { font: 700 calc(38px * var(--fs))/1.2 var(--body); margin: 18px 0 10px; word-break: break-word; }
  .show-ru { font-size: calc(18px * var(--fs)); color: var(--slate); }
  .foot { color: var(--faint); font-size: calc(13px * var(--fs)); text-align: center; margin: 26px 0 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px); transform: translate(-50%, 16px);
    background: var(--ink); color: var(--snow); padding: 10px 15px; border-radius: 12px; font-size: calc(15px * var(--fs)); opacity: 0; transition: .2s; z-index: 60; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media print {
    nav.tabs, .appbar .iconbtn, .strip, .filters, .banner, .now, .foot, .fab, .seg, #map, .row-acts { display: none !important; }
    section.panel { display: block !important; }
    body { padding: 0; background: #fff; }
  }
</style>
</head>
<body>

<header class="appbar" id="appbar">
  <div class="wrap">
    <h1 id="title">Планировщик поездки</h1>
    <button class="iconbtn" id="refresh" type="button" aria-label="Обновить данные"></button>
    <a class="iconbtn" id="edit-link" href="#" target="_blank" rel="noopener" aria-label="Открыть таблицу"></a>
    <button class="iconbtn" id="settings" type="button" aria-label="Настройки" data-settings></button>
  </div>
</header>

<main class="wrap" id="main">
  <div class="hero">
    <p class="status" id="status"></p>
    <div class="dates" id="dates"></div>
    <div class="people" id="people"></div>
    <nav class="sign" id="sign" aria-label="Маршрут по городам" hidden></nav>
    <p class="note" id="note"></p>
  </div>
  <div id="banner" role="status"></div>
  <div id="pending"></div>

  <section class="panel" id="p-route" aria-labelledby="t-route">
    <div id="now"></div>
    <div class="seg" id="route-view">
      <button type="button" data-view="list">Список</button>
      <button type="button" data-view="map">Карта</button>
    </div>
    <div class="strip" id="strip" aria-label="Дни поездки"></div>
    <div class="filters" id="filters" aria-label="Фильтр событий"></div>
    <div id="route-list">
      <div id="route"></div>
      <div class="row-acts" style="margin-top:22px"><button class="btn secondary small" type="button" data-ics-menu>Добавить в календарь</button></div>
    </div>
    <div id="route-map" hidden>
      <div id="map" role="region" aria-label="Карта маршрута"></div>
      <p class="map-note" id="map-note"></p>
    </div>
  </section>

  <section class="panel" id="p-budget" aria-labelledby="t-budget">
    <div class="seg" id="seg-budget">
      <button type="button" data-seg="fact">Расходы</button>
      <button type="button" data-seg="plan">План</button>
    </div>
    <div id="budget"></div>
  </section>

  <section class="panel" id="p-prep" aria-labelledby="t-prep">
    <div class="seg" id="seg-prep">
      <button type="button" data-prep="tasks">Дела</button>
      <button type="button" data-prep="pack">Вещи</button>
      <button type="button" data-prep="book">Брони</button>
      <button type="button" data-prep="gift">Подарки</button>
    </div>
    <div id="prep"></div>
  </section>

  <section class="panel" id="p-phrases" aria-labelledby="t-phrases">
    <h2 class="sec">Немецкие фразы</h2>
    <div id="phrases"></div>
  </section>

  <section class="panel" id="p-ideas" aria-labelledby="t-ideas">
    <h2 class="sec">Идеи</h2>
    <div id="ideas"></div>
  </section>

  <div class="foot" id="updated"></div>
</main>

<button class="fab" id="fab" type="button" hidden></button>
<nav class="tabs" id="tabs" aria-label="Разделы"></nav>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="handle" id="sheet-handle"><i></i></div>
  <div class="inner" id="sheet-body"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function () {
  "use strict";

  // ================= настройки =================
  const CFG = Object.assign({ SHEET_ID: "", SCRIPT_URL: "", TABS: {}, REFRESH_SECONDS: 120, EXPENSE_CATEGORIES: null, TIMEZONE: "Europe/Vienna" }, window.PLANNER_CONFIG || {});

  // Формат столбца «Часы»: «09:00-17:30» или «пн-сб 06:00-22:00; вс 07:00-22:00»; «пн закрыто».
  const WD = { "пн": 1, "вт": 2, "ср": 3, "чт": 4, "пт": 5, "сб": 6, "вс": 0 };
  const DAYRE = "(?:пн|вт|ср|чт|пт|сб|вс)";

        rest = m[2];

      const t = rest.match(/(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})/);
      return t ? { days, open: +t[1] * 60 + +t[2], close: +t[3] * 60 + +t[4] } : null;
    }).filter(Boolean);

  function drawMap() {
    if (!LMAP) return;
    if (LLAYER) LLAYER.remove();
    LLAYER = L.layerGroup().addTo(LMAP);
    const singleDay = state.mapDay !== "all";
    const pts = [], seen = {}, noCoords = [];
    let step = 0;

    MODEL.days.forEach((d) => {
      if (singleDay && d.key !== state.mapDay) return;
      const dayPts = [];
      d.list.filter(passFilter).forEach((r) => {
        const ll = r._ll || geoCache[mapsQuery(r)];
        if (!ll) { noCoords.push(r); return; }
        const k = ll.join(",");
        pts.push(ll); dayPts.push(ll);
        if (seen[k]) { seen[k].items.push(r); return; }
        step++;
        seen[k] = { ll, items: [r], day: d, label: singleDay ? step : (d.n || "") };
      });
      if (dayPts.length > 1) {
        L.polyline(dayPts, {
          color: MODEL.todayDay === d ? "#8C2338" : "#173A33",
          weight: singleDay ? 3 : 2,
          opacity: singleDay ? 0.75 : 0.45,
          dashArray: singleDay ? null : "4 6"
        }).addTo(LLAYER);
      }
    });

    Object.values(seen).forEach((p) => {
      const isToday = MODEL.todayDay === p.day;
      const allIdeas = p.items.every((r) => low(r["Статус"]) === "идея");
      const mixed = p.day.list.some((r) => low(r["Статус"]) && low(r["Статус"]) !== "идея");
      const cls = "pin" + (isToday ? " today" : "") + (allIdeas && mixed ? " idea" : "");
      const m = L.marker(p.ll, {
        icon: L.divIcon({ className: "", html: '<div class="' + cls + '">' + esc(p.label) + "</div>", iconSize: [30, 30], iconAnchor: [15, 15] }),
        keyboard: true,
        title: p.items[0]["Что"]
      });
      m.bindPopup(p.items.map((r) => {
        const nav = dirUrl(r);
        return "<b>" + esc(r["Что"]) + "</b><br>" +
          esc([singleDay ? "" : "День " + (p.day.n || p.day.key), r["Время"], r["Статус"]].filter(Boolean).join(" · ")) +
          '<div style="display:flex;gap:6px;margin-top:6px">' +
          '<button type="button" data-open="' + r._i + '">Подробнее</button>' +
          (nav ? '<a class="pop-link" href="' + esc(nav) + '" target="_blank" rel="noopener">Маршрут</a>' : "") +
          "</div>";
      }).join("<hr>"));
      m.addTo(LLAYER);
    });

    if (pts.length) LMAP.fitBounds(L.latLngBounds(pts).pad(0.15), { maxZoom: 15 });

  }

  // ================= Википедия: фото и краткое описание =================

  const near = (r, p, km) => r._ll && p.coordinates && p.coordinates[0] && hav(r._ll, [p.coordinates[0].lat, p.coordinates[0].lon]) < km;

  // ================= календарь (.ics) =================
  const DUR = { "экскурсия": 120, "еда": 90, "отдых": 90, "переезд": 60, "жильё": 30, "жилье": 30 };
  const icsEsc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  const icsDT = (d, min) => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(Math.floor(min / 60) % 24) + pad(min % 60) + "00";
  function buildICS(list) {
    const tz = CFG.TIMEZONE || "Europe/Vienna";
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//planner//trip//RU", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:" + icsEsc(MODEL.title),

      "BEGIN:DAYLIGHT", "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST", "END:DAYLIGHT", "END:VTIMEZONE"];

        rows.slice().reverse().map((r) => '<button type="button" class="r" data-exp="' + esc(r.ID || "") + '"><span class="l">' + esc(r["Описание"] || r["Категория"] || "Расход") +

  function dailyChart(ex) {
    if (!MODEL.start || !MODEL.end) return "";
    const n = dayDiff(MODEL.end, MODEL.start) + 1; if (n < 1 || n > 31) return "";

    ex.forEach((r) => { if (!r._date) return; const i = dayDiff(r._date, MODEL.start); if (i < 0) before += r._amt; else if (i < n) buckets[i].v += r._amt; });
    if (before) buckets.unshift({ d: null, v: before, label: "до" });
    const max = Math.max(...buckets.map((b) => b.v), 1), t = now();
    const peak = buckets.reduce((a, b) => (b.v > a.v ? b : a), buckets[0]);
    const sel = state.bar;
    const bars = buckets.map((b, i) => {
      const h = Math.round(b.v / max * 100), isT = b.d && sameDay(b.d, t), show = b.v && (b === peak || isT || sel === i);
      const name = b.d ? fmtDM(b.d) : "до поездки";

        (show ? '<span class="val" style="bottom:calc(' + h + '% + 4px)">' + esc(fmtNum(Math.round(b.v))) + "</span>" : "") +
        '<span class="col' + (b.v ? "" : " zero") + '" style="height:' + h + '%"></span></button>';
    }).join("");
    const axis = buckets.map((b) => '<span class="' + (b.d && sameDay(b.d, t) ? "today" : "") + '">' + (b.d ? b.d.getDate() : "до") + "</span>").join("");
    return '<div class="chart"><h3>По дням, ' + esc(MODEL.currency) + '</h3><div class="bars">' + bars + '</div><div class="axis" aria-hidden="true">' + axis + "</div></div>";

      ["Wo ist die nächste Apotheke?", "во ист ди нэхьсте апотеке", "Где ближайшая аптека?"],
      ["Rufen Sie bitte einen Krankenwagen!", "руфен зи битте айнен кранкенваген", "Вызовите, пожалуйста, скорую! Общий номер экстренных служб — 112"],
      ["Ich habe mich verlaufen.", "ихь хабе михь ферлауфен", "Я заблудился (заблудилась)"]]],
  ];
  const ALL_PHRASES = []; PHRASES.forEach(([, list]) => list.forEach((p) => ALL_PHRASES.push(p)));
  const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
  if (canSpeak && "onvoiceschanged" in speechSynthesis) speechSynthesis.addEventListener("voiceschanged", () => speechSynthesis.getVoices(), { once: true });
  function speak(i) {
    const p = ALL_PHRASES[+i]; if (!p || !canSpeak) return;
    const u = new SpeechSynthesisUtterance(p[0].replace(/…/g, "")); u.lang = "de-DE"; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find((x) => /^de(-|_)?(AT|DE)?/i.test(x.lang)); if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  function renderPhrases() {
    let i = 0, html = '<p class="hint">Нажмите «Послушать», чтобы телефон произнёс фразу, или «Показать», чтобы крупно показать её собеседнику.</p>';
    PHRASES.forEach(([cat, list]) => {
      html += '<h3 class="ph-cat">' + esc(cat) + "</h3>";
      list.forEach((p) => { html += '<div class="ph" lang="ru"><div class="de" lang="de">' + esc(p[0]) + '</div><div class="tr">' + esc(p[1]) + '</div><div class="ru">' + esc(p[2]) + "</div>" +
        '<div class="acts">' + (canSpeak ? '<button class="btn secondary" type="button" data-say="' + i + '" aria-label="' + esc("Послушать: " + p[0]) + '">' + icon("sound") + "Послушать</button>" : "") +
        '<button class="btn secondary" type="button" data-show="' + i + '" aria-label="' + esc("Показать крупно: " + p[0]) + '">' + icon("expand") + "Показать</button></div></div>"; i++; });
    });
    $("phrases").innerHTML = html;
  }
  function showPhrase(i) {
    const p = ALL_PHRASES[+i]; if (!p) return;
    openSheet(sheetTop("Показать собеседнику") + '<div class="show-de" lang="de">' + esc(p[0]) + '</div><div class="show-ru">' + esc(p[2]) + "</div>" +
      '<div class="actions">' + (canSpeak ? '<button class="btn" type="button" data-say="' + i + '">' + icon("sound") + "Послушать</button>" : "") + '<button class="btn secondary" type="button" data-close>Закрыть</button></div>');
  }
  function renderTasks() {
    const rows = MODEL.tasks.filter((r) => r["Дело"]), t = now();
    if (!rows.length) { $("prep").innerHTML = '<div class="empty">Дел пока нет. Добавьте их во вкладку «' + esc(TABS.tasks) + '» таблицы.</div>'; return; }
    const items = rows.map((r) => Object.assign(r, { _due: parseDate(r["До"]), _done: isYes(r["Готово"]) }));
    const open = items.filter((r) => !r._done).sort((a, b) => (a._due || 9e15) - (b._due || 9e15)), done = items.filter((r) => r._done);
    const late = open.filter((r) => r._due && dayDiff(r._due, t) < 0), rest = open.filter((r) => !(r._due && dayDiff(r._due, t) < 0));
    const tag = CAN_WRITE ? "button" : "div";
    const row = (r) => {
      let due = "", cls = "";
      if (r._due) { const dd = dayDiff(r._due, t);
        if (r._done) due = "до " + fmtDMs(r._due);
        else if (dd < 0) { due = "просрочено на " + days(-dd); cls = "late"; }
        else if (dd === 0) { due = "сегодня"; cls = "late"; }
        else if (dd <= 7) { due = "через " + days(dd); cls = "soon"; }
        else due = "до " + fmtDMs(r._due); }
      return "<" + tag + (CAN_WRITE ? ' type="button" data-task="' + esc(r["Дело"]) + '" aria-pressed="' + r._done + '"' : ' aria-label="' + esc(r["Дело"] + (r._done ? ", сделано" : "")) + '"') + ' class="check">' +
        '<span class="box">' + (r._done ? icon("check") : "") + '</span><span class="name">' + esc(r["Дело"]) +
        "<small>" + (due ? '<span class="due ' + cls + '">' + esc(due) + "</span>" : "") + (due && r["Кто"] ? ", " : "") + esc(r["Кто"] || "") + (r._pending ? ' <span class="badge wait">ждёт</span>' : "") + "</small>" +
        (r["Заметка"] ? "<small>" + esc(r["Заметка"]) + "</small>" : "") + "</span></" + tag + ">" +
        (safeUrl(r["Ссылка"]) && !r._done ? '<div class="row-acts" style="margin:-2px 0 8px 48px"><a href="' + esc(safeUrl(r["Ссылка"])) + '" target="_blank" rel="noopener">Открыть сайт</a></div>' : "");
    };
    let html = '<div>Сделано ' + done.length + " из " + items.length + '</div><div class="bar" role="img" aria-label="Сделано ' + done.length + " из " + items.length + '"><i style="width:' + Math.round(done.length / items.length * 100) + '%"></i></div>';
    if (late.length) html += '<div class="group-head"><span>Просрочено</span><span>' + late.length + "</span></div>" + late.map(row).join("");
    if (rest.length) html += '<div class="group-head"><span>Предстоит</span><span>' + rest.length + "</span></div>" + rest.map(row).join("");
    if (done.length) html += '<div class="group-head"><span>Готово</span><span>' + done.length + "</span></div>" + done.map(row).join("");
    html += '<p class="hint">' + (CAN_WRITE ? "Нажмите на дело, чтобы отметить его сделанным." : "Отметка ставится в таблице: «Да» в столбце «Готово».") + "</p>";
    $("prep").innerHTML = html;
  }
  function renderPack() {
    const rows = MODEL.packing.filter((r) => r["Вещь"]);
    if (!rows.length) { $("prep").innerHTML = '<div class="empty">Список пуст. Заполните вкладку «' + esc(TABS.packing) + '».</div>'; return; }
    const done = rows.filter((r) => isYes(r["Взято"])).length, groups = {};
    rows.forEach((r) => { const g = r["Категория"] || "Разное"; (groups[g] = groups[g] || []).push(r); });
    const tag = CAN_WRITE ? "button" : "div";
    let html = "<div>Собрано " + done + " из " + rows.length + '</div><div class="bar" role="img" aria-label="Собрано ' + done + " из " + rows.length + '"><i style="width:' + Math.round(done / rows.length * 100) + '%"></i></div>';
    Object.keys(groups).forEach((g) => {
      html += '<div class="group-head"><span>' + esc(g) + "</span></div>";
      groups[g].forEach((r) => { const ok = isYes(r["Взято"]);
        html += "<" + tag + (CAN_WRITE ? ' type="button" data-pack="' + esc(r["Вещь"]) + '" aria-pressed="' + ok + '"' : "") + ' class="check"><span class="box">' + (ok ? icon("check") : "") + '</span><span class="name">' + esc(r["Вещь"]) + "</span>" +
          '<span class="side">' + esc(r["Кто берёт"] || "") + (r._pending ? ' <span class="badge wait">ждёт</span>' : "") + "</span></" + tag + ">"; });
    });
    html += '<p class="hint">' + (CAN_WRITE ? "Нажмите на вещь, чтобы отметить её собранной. Отметку видят все." : "Отметка ставится в таблице: «Да» в столбце «Взято».") + "</p>";
    $("prep").innerHTML = html;
  }

  // ================= идеи и голоса =================
  function renderIdeas() {
    const rows = MODEL.ideas.filter((r) => r["Идея"]).map((r, i) => Object.assign(r, { _v: voters(r["Голоса"]), _o: i }));
    rows.sort((a, b) => b._v.length - a._v.length || a._o - b._o);
    const me = low(user.name);
    $("ideas").innerHTML = (rows.length ? rows.map((r) => {
      const mine = !!me && r._v.some((v) => low(v) === me);
      return '<div class="idea"><div class="txt"><div class="t">' + esc(r["Идея"]) + "</div>" + (r["Комментарий"] ? '<div class="c">' + esc(r["Комментарий"]) + "</div>" : "") +
        '<div class="a">' + esc([r["Автор"] ? "Предложил: " + r["Автор"] : "", r._v.length ? "За: " + r._v.join(", ") : ""].filter(Boolean).join(". ")) + (r._pending ? ' <span class="badge wait">ждёт отправки</span>' : "") + "</div>" +
        "</div>" +
        (CAN_WRITE ? '<button type="button" class="vote" data-vote="' + esc(r["Идея"]) + '" aria-pressed="' + mine + '" aria-label="' + esc((mine ? "Убрать голос за: " : "Голосовать за: ") + r["Идея"] + ". Голосов: " + r._v.length) + '">' + icon("heart") + "<b>" + r._v.length + "</b></button>"
          : '<span class="vote" aria-label="Голосов: ' + r._v.length + '">' + icon("heart") + "<b>" + r._v.length + "</b></span>") + ideaLinks(r) + "</div>";
    }).join("") : '<div class="empty">Идей пока нет.</div>') + '<p class="hint">' + (CAN_WRITE ? "Отметьте понравившиеся идеи — популярные поднимаются наверх. " : "Идеи добавляются во вкладке «" + esc(TABS.ideas) + "» таблицы. ") + "Поправить или удалить идею можно в таблице, вкладка «" + esc(TABS.ideas) + "».</p>";
    updateFab();
  }
  // Поиск в Google и видео для идеи; свой сайт — из столбца «Ссылка»
  function ideaLinks(r) {
    const google = "https://www.google.com/search?q=" + encodeURIComponent(String(r["Идея"] || "").trim());
    const video = "https://www.youtube.com/results?search_query=" + encodeURIComponent(placeName({ "Что": r["Идея"] }));
    const site = safeUrl(r["Ссылка"]);
    const a = (href, ic, label, aria) => '<a class="btn secondary" href="' + esc(href) + '" target="_blank" rel="noopener" aria-label="' + esc(aria + ": " + r["Идея"]) + '">' + icon(ic) + label + "</a>";
    return '<div class="idea-links">' + a(google, "search", "Google", "Найти в Google") + a(video, "play", "Видео", "Видео") + (site ? a(site, "link", "Сайт", "Сайт") : "") + "</div>";
  }
  function updateFab() {
    const f = $("fab");
    if (CAN_WRITE && state.tab === "p-budget" && state.seg === "fact") { f.innerHTML = icon("plus") + "Расход"; f.dataset.act = "expense"; f.hidden = false; }
    else if (CAN_WRITE && state.tab === "p-ideas") { f.innerHTML = icon("plus") + "Идея"; f.dataset.act = "idea"; f.hidden = false; }
    else if (CAN_WRITE && state.tab === "p-prep" && state.prep === "gift" && !(MODEL && MODEL.missing.includes("gifts"))) { f.innerHTML = icon("plus") + "Подарок"; f.dataset.act = "gift"; f.hidden = false; }
    else f.hidden = true;
  }

  // ================= общее =================
  function renderAll() {
    if (!DATA) return;
    buildModel(); renderHeader(); renderNow(); renderStrip(); renderFilters(); renderRoute(); renderBudget(); renderPrep(); renderIdeas(); renderPending();
    if (!$("phrases").innerHTML) renderPhrases();
    const t = DATA.loadedAt ? new Date(DATA.loadedAt).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
    $("updated").textContent = DATA.demo ? "Демонстрационные данные" : (t ? "Данные от " + t : "");
  }
  function banner(kind, html) { $("banner").innerHTML = html ? '<div class="banner ' + kind + '">' + html + "</div>" : ""; }
  let toastT;
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 4000); }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); } catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove(); }
    toast("Адрес скопирован");
  }
  let busy = false, first = true;
  async function refresh(manual) {
    if (busy) return; busy = true; $("refresh").classList.add("spin");
    try {
      const data = await loadAll(); DATA = data;
      if (!data.demo) lsSet(K.cache, data);
      renderAll();
      if (data.demo) banner("info", "Показаны демонстрационные данные." + (CFG.SHEET_ID ? "" : " Укажите SHEET_ID в config.js."));
      else if (data.warnings && data.warnings.length) banner("warn", "Часть данных не загрузилась: " + esc(data.warnings.join("; ")) + ".");
      else if (!$("banner").textContent.includes("код")) banner("", "");
      if (manual) toast("Данные обновлены");
    } catch (err) {
      const cached = lsGet(K.cache); if (cached && !DATA) { DATA = cached; renderAll(); }
      const off = navigator.onLine === false;
      banner("warn", (off ? "Нет подключения к интернету." : "Не удалось загрузить таблицу: " + esc(err.message) + ".") + (DATA ? " Показана сохранённая версия." : "") + (!off ? " Проверьте, что доступ к таблице открыт по ссылке (роль «Читатель»)." : ""));
    } finally {
      busy = false; $("refresh").classList.remove("spin");
      if (first && DATA) { first = false; if (MODEL.todayDay) setActiveChip(MODEL.todayDay.key); flush(); }
    }
  }

  // ================= вкладки =================
  const TAB_DEF = [["p-route", "route", "Маршрут"], ["p-budget", "wallet", "Бюджет"], ["p-prep", "list", "Списки"], ["p-ideas", "idea", "Идеи"], ["p-phrases", "chat", "Фразы"]];
  $("tabs").innerHTML = TAB_DEF.map(([id, ic, l]) => '<button type="button" data-panel="' + id + '" id="t-' + id.slice(2) + '">' + icon(ic) + "<span>" + l + "</span></button>").join("");
  function showTab(id) {
    if (!document.getElementById(id)) id = "p-route";
    const changed = state.tab !== id || !document.getElementById(id).classList.contains("active");
    state.tab = id; lsSet("planner-tab", id);
    document.querySelectorAll("#tabs button").forEach((b) => { if (b.dataset.panel === id) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    document.querySelectorAll("section.panel").forEach((p) => p.classList.toggle("active", p.id === id));
    document.querySelector(".hero").hidden = id !== "p-route";
    updateFab();
    if (changed) window.scrollTo({ top: 0 });
    if (id === "p-route" && state.view === "map" && LMAP) setTimeout(() => LMAP.invalidateSize(), 30);
  }
  showTab(state.tab);

  // ================= события =================
  $("refresh").innerHTML = icon("refresh"); $("edit-link").innerHTML = icon("sheet"); $("settings").innerHTML = icon("gear");
  [["refresh", "Обновить данные"], ["edit-link", "Открыть таблицу"], ["settings", "Настройки и размер текста"]].forEach(([id, t]) => { $(id).title = t; $(id).setAttribute("aria-label", t); });
  if (EDIT_URL) $("edit-link").href = EDIT_URL; else $("edit-link").hidden = true;
  $("refresh").addEventListener("click", () => { refresh(true); flush(); });
  document.addEventListener("click", (e) => {
    const at = (s) => e.target.closest(s); let el;
    if ((el = at("#tabs button"))) return showTab(el.dataset.panel);
    if ((el = at("[data-view]"))) { state.view = el.dataset.view; state.mapDay = "all"; renderStrip(); renderRoute();
      if (state.view === "map") $("route-view").scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" }); return; }
    if (at("[data-past]")) { state.showPast = !state.showPast; renderRoute(); return; }
    if ((el = at("[data-goto]"))) { if (el.dataset.goto === "all") { state.mapDay = "all"; renderStrip(); showMap(); return; } return gotoDay(el.dataset.goto); }
    if ((el = at("[data-open]"))) { if (LMAP) LMAP.closePopup(); return openEvent(el.dataset.open); }
    if ((el = at("[data-f]"))) { state.filter = el.dataset.f; lsSet("planner-filter", state.filter); renderFilters(); renderRoute(); return; }
    if ((el = at("[data-seg]"))) { state.seg = el.dataset.seg; lsSet("planner-seg", state.seg); renderBudget(); return; }
    if ((el = at("[data-prep]"))) { state.prep = el.dataset.prep; lsSet("planner-prep", state.prep); renderPrep(); return; }
    if ((el = at("[data-bar]"))) { const i = +el.dataset.bar; state.bar = state.bar === i ? null : i; renderBudget(); const b = document.querySelector('[data-bar="' + i + '"]'); if (b) b.focus(); return; }
    if (at("[data-close]") || e.target === $("backdrop")) return closeSheet();
    if ((el = at("[data-copy]"))) return copy(el.dataset.copy);
    if (at("[data-settings]")) return openSettings();
    if (at("[data-save-settings]")) return saveSettings();
    if (at("[data-check-code]")) return checkCode();
    if ((el = at("#fab"))) return el.dataset.act === "idea" ? openIdeaForm() : el.dataset.act === "gift" ? openGiftForm() : openExpenseForm();
    if ((el = at("[data-cat]"))) { $("f-cats").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === el))); return; }
    if (at("[data-save-expense]")) return saveExpense();
    if ((el = at("[data-exp]"))) return openExpense(el.dataset.exp);
    if ((el = at("[data-del-expense]"))) {
      if (!el.dataset.confirm) { el.dataset.confirm = "1"; el.querySelector("span").textContent = "Нажмите ещё раз, чтобы удалить"; return; }
      if (submit("deleteExpense", { id: el.dataset.delExpense })) { closeSheet(); toast("Расход удалён"); } return;
    }
    if (at("[data-save-idea]")) return saveIdea();
    if (at("[data-nn]")) return openNowNext();
    if ((el = at("[data-bk]"))) return submit("setBooking", { what: el.dataset.bk, status: el.dataset.bkSt });
    if ((el = at("[data-gift]"))) return submit("setGift", { what: el.dataset.gift, to: el.dataset.giftTo, done: el.getAttribute("aria-pressed") !== "true" });
    if (at("[data-save-gift]")) return saveGift();
    if ((el = at("[data-say]"))) return speak(el.dataset.say);
    if ((el = at("[data-show]"))) return showPhrase(el.dataset.show);
    if ((el = at("[data-walk]"))) return walkFromMe(el.dataset.walk);
    if ((el = at("[data-opt]"))) return openOptimize(el.dataset.opt);
    if ((el = at("[data-opt-apply]"))) return applyOptimize(el.dataset.optApply);
    if ((el = at("[data-fs]"))) { setFs(el.dataset.fs); lsSet(FS_KEY, el.dataset.fs); $("s-fs").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === el))); return; }
    if ((el = at("[data-vote]"))) { if (!user.name && !FORCE_DEMO) return openSettings("Чтобы голосовать, укажите своё имя."); return submit("voteIdea", { idea: el.dataset.vote, name: user.name || "Я", on: el.getAttribute("aria-pressed") !== "true" }); }
    if ((el = at("[data-pack]"))) return submit("setPacked", { item: el.dataset.pack, done: el.getAttribute("aria-pressed") !== "true" });
    if ((el = at("[data-task]"))) return submit("setTask", { task: el.dataset.task, done: el.getAttribute("aria-pressed") !== "true" });
    if (at("[data-ics-menu]")) return openIcsMenu();
    if ((el = at("[data-ics]"))) { const timed = MODEL.items.filter((r) => r._min != null && r._date); downloadICS(el.dataset.ics === "planned" ? timed.filter((r) => low(r["Статус"]) !== "идея") : timed, "poezdka"); return closeSheet(); }
    if ((el = at("[data-ics-one]"))) { const r = MODEL.items.find((x) => x._i === +el.dataset.icsOne); if (r) downloadICS([r], "sobytie"); return; }
  });
  document.addEventListener("keydown", (e) => {
    const sh = $("sheet");
    if (e.key === "Escape") return closeSheet();
    if (e.key === "Enter" && e.target.id === "f-amount") { e.preventDefault(); $("f-note").focus(); }
    if (e.key === "Tab" && sh.classList.contains("open")) {           // удерживаем фокус внутри карточки
      const f = [...sh.querySelectorAll("button, a[href], input, textarea, select")].filter((x) => !x.disabled && x.offsetParent !== null);
      if (!f.length) return; const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  });
  window.addEventListener("scroll", () => $("appbar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });
  window.addEventListener("popstate", () => closeSheet(true));
  window.addEventListener("online", () => { flush(); refresh(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !FORCE_DEMO) { refresh(); flush(); } });
  if (!FORCE_DEMO && CFG.REFRESH_SECONDS > 0) setInterval(() => { if (!document.hidden && !$("sheet").classList.contains("open")) refresh(); }, CFG.REFRESH_SECONDS * 1000);
  setInterval(() => { if (DATA && MODEL && MODEL.todayDay) renderNow(); }, 60000);
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

  refresh();
})();
</script>
</body>
